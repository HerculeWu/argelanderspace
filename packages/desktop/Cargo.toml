# The desktop shell (desktop-app ticket 20; ADR 0010): a Tauri window that loads the local server's page, looks
# after the desktop host (a Node process speaking the line protocol on its stdin/stdout) and answers its native
# requests. No business logic lives here, and this crate is not part of the four gates (docs/contracts.md).
#
# The version shown to people comes from packages/app/package.json (tauri.conf.json `version`); the crate's own
# version below is not used anywhere.
#
# The app icon (desktop-app ticket 25) is generated into icons/ from icons/source/ by scripts/build-icons.mjs
# (docs/engineering.md, desktop package).
[package]
name = "argelanderspace-desktop"
version = "0.0.0"
edition = "2021"
publish = false

# Not part of any Cargo workspace: the repository's workspace is pnpm's.
[workspace]

[[bin]]
name = "argelanderspace-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools`: the developer tools in release builds too (spec User Story 74; desktop-app ticket 21).
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
open = "5"
# Keys in the order written: the records and lines read like the host's (`t`, `level`, `event` first).
serde_json = { version = "1", features = ["preserve_order"] }

# Linux (desktop-app tickets 20, 21): the WebKitGTK and GTK Tauri itself uses.
[target.'cfg(target_os = "linux")'.dependencies]
# The same WebKitGTK binding Tauri uses: the shell takes Tauri's scripts out of the page (src/page_guard.rs).
webkit2gtk = "2.0"
# The save dialog of the page's downloads (src/download.rs) and the about dialog (src/menu.rs).
gtk = "0.18"
# Test builds only (`--features smoke-probe`): reads what the page sees, for the smoke checks.
javascriptcore-rs = { version = "1.1", optional = true }
gio = { version = "0.18", optional = true }

# Unix (Linux and macOS): the host's process group (killpg) and the user id the single-instance socket must belong to.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# macOS (desktop-app ticket 30): the WKWebView binding wry uses, to take Tauri's scripts and message handler out of the
# webview's user content controller (src/page_guard.rs). The versions wry 0.57 pulls in: no crate is added.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKUserContentController"] }

# macOS and Windows (desktop-app ticket 30): the native save dialog of the page's downloads (src/download.rs); the same
# rfd the dialog plugin uses, so no crate is added.
[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.16", default-features = false }

# Windows (desktop-app ticket 30): the job object the host runs in, the single-instance named pipe (windows-sys), and
# the WebView2 binding wry uses, to take Tauri's scripts out of the page (src/page_guard.rs). The versions wry 0.57 and
# tao pull in: no crate is added.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }
webview2-com = "0.39"
windows-core = "0.62"

[features]
# Never in a release: a probe that evaluates a fixed script in the page after each load and appends the answer to the
# file named by ARGELANDERSPACE_SHELL_PROBE (docs/engineering.md, desktop shell smoke).
smoke-probe = ["dep:javascriptcore-rs", "dep:gio"]
# The desktop package (desktop-app ticket 23): the host is the bundle's own Node and app build, found in the resource
# directory (src/launch.rs `HostLauncher::packaged`). Without it the shell runs the repository's build with the `node`
# on PATH (development). Packaging passes it: `cargo tauri build --features packaged --config tauri.package.conf.json`.
packaged = []

[profile.release]
opt-level = "s"
strip = true
