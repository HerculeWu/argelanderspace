# Desktop packages for the four targets, put into a DRAFT GitHub Release (desktop-app ticket 26; docs/engineering.md
# 「发布工作流」). This is the repository's only workflow and it only releases: the four gates are not run here and
# there is no CI (docs/contracts.md; the user's change 9 of 2026-10-13). Nothing is published: the draft is looked at
# and made public by hand.
#
# When it runs:
#   - a pushed tag `v<version>`, where <version> is packages/app/package.json's `version` (the single source,
#     ticket 16); any other tag fails in the preflight before anything is built;
#   - by hand (Actions > Release > Run workflow) on a branch or tag: it builds that commit and names the draft
#     `v<version>`; the tag itself is made only when the draft is published. `targets` builds all four (the default) or
#     one, for trying a runner; a draft is made only when every chosen target succeeded.
#
# Pins: actions by commit (the tag in the comment); the build's Node = the Node the package carries
# (DESKTOP_NODE_VERSION in packages/app/scripts/desktop-package-lib.mjs; the preflight checks they agree); pnpm from the
# root package.json's packageManager through corepack; Rust and tauri-cli below. The Node download's signature is
# always checked (fetch-node-keyring.mjs: nodejs/release-keys at a pinned commit, sha256-checked).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      targets:
        description: "Which targets to build (a draft is made only when all of them succeed)"
        type: choice
        default: all
        options: [all, linux-x64, win32-x64, darwin-arm64, darwin-x64]

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.15.0"
  RUST_TOOLCHAIN: "1.96.0"
  TAURI_CLI_VERSION: "2.12.2"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Choose the targets
        id: matrix
        env:
          CHOSEN: ${{ github.event_name == 'workflow_dispatch' && inputs.targets || 'all' }}
        run: |
          all='[
            {"target":"linux-x64","os":"ubuntu-24.04","bundles":"deb,appimage"},
            {"target":"win32-x64","os":"windows-2022","bundles":"nsis"},
            {"target":"darwin-arm64","os":"macos-15","bundles":"dmg"},
            {"target":"darwin-x64","os":"macos-15-intel","bundles":"dmg"}
          ]'
          matrix=$(jq -c --arg t "$CHOSEN" '{include: [.[] | select($t == "all" or .target == $t)]}' <<<"$all")
          test "$(jq '.include | length' <<<"$matrix")" -gt 0
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      BUNDLES: ${{ matrix.bundles }}
      EVIDENCE: ${{ github.workspace }}/release-evidence/${{ matrix.target }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No cache: a release is built from a clean store.
          package-manager-cache: false

      - name: Preflight (tag rule, build Node, vendored license texts)
        env:
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT: ${{ github.event_name }}
        run: |
          mkdir -p "$EVIDENCE"
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = tag ]; then
            node packages/app/scripts/release-preflight.mjs --target "$TARGET" --ref "$REF"
          else
            node packages/app/scripts/release-preflight.mjs --target "$TARGET"
          fi

      - name: Linux build and smoke dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # WebKitGTK/GTK for the shell; file/patchelf/libfuse2t64 for the AppImage bundler; gpgv for Node's signature;
          # xvfb for the shell smoke; latexmk with a minimal TeX Live for the smoke's CLI ingest.
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev file patchelf libfuse2t64 \
            gpgv unzip xvfb xauth latexmk texlive-latex-base

      - name: gpgv is there (fail closed otherwise)
        run: |
          if ! command -v gpgv >/dev/null; then
            if [ "$RUNNER_OS" = macOS ]; then brew install gnupg; fi
          fi
          command -v gpgv
          gpgv --version | head -n 1

      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"

      - name: Install the workspace (frozen lockfile)
        run: corepack pnpm install --frozen-lockfile

      - name: Build (the npm build the package carries)
        run: corepack pnpm -r build

      - name: tauri-cli ${{ env.TAURI_CLI_VERSION }}
        run: cargo install tauri-cli --version "=$TAURI_CLI_VERSION" --locked --root "$RUNNER_TEMP/tauri-cli"

      - name: Node release keyring (pinned commit and sha256)
        run: node packages/app/scripts/fetch-node-keyring.mjs --out "$RUNNER_TEMP/node-release-keys.kbx"

      - name: Assemble the sidecar (dependency directory, Node with its signature checked, notices)
        run: |
          node packages/app/scripts/desktop-sidecar.mjs --target "$TARGET" \
            --node-keyring "$RUNNER_TEMP/node-release-keys.kbx" --online 2>&1 | tee "$EVIDENCE/sidecar.txt"
          cp packages/desktop/target/package-resources/sidecar/sidecar-manifest.json "$EVIDENCE/"

      - name: Windows command-line launcher on a real cmd (code pages, special characters, bare-name start)
        if: runner.os == 'Windows'
        run: node packages/app/scripts/windows-launcher-check.mjs 2>&1 | tee "$EVIDENCE/windows-launcher.txt"

      - name: Build the shell and bundle (${{ matrix.bundles }})
        working-directory: packages/desktop
        run: |
          "$RUNNER_TEMP/tauri-cli/bin/cargo-tauri" build --features packaged \
            --config tauri.package.conf.json --bundles "$BUNDLES" 2>&1 | tee "$EVIDENCE/tauri-build.txt"

      - name: Desktop package smoke (deb and AppImage, shell on a virtual display)
        if: runner.os == 'Linux'
        run: |
          deb=$(ls packages/desktop/target/release/bundle/deb/*.deb)
          appimage=$(ls packages/desktop/target/release/bundle/appimage/*.AppImage)
          xvfb-run -a node packages/app/scripts/smoke-desktop-package.mjs --deb "$deb" --shell \
            --label deb --evidence "$EVIDENCE"
          xvfb-run -a node packages/app/scripts/smoke-desktop-package.mjs --appimage "$appimage" --shell \
            --label appimage --evidence "$EVIDENCE"

      - name: Partial check on macOS and Windows (the package smoke is Linux only)
        if: runner.os != 'Linux'
        run: |
          # NOT the desktop package smoke (smoke-desktop-package.mjs reads a deb or an AppImage and /proc): only that
          # the bundle carries the sidecar and its Node runs the package's CLI at the app's version. Untested here: the
          # host from the bundle, the page, PDFium, the keychain, Copilot, the ingest, the shell itself.
          version=$(node -p 'require("./packages/app/package.json").version')
          if [ "$RUNNER_OS" = macOS ]; then
            res=$(ls -d packages/desktop/target/release/bundle/macos/*.app)/Contents/Resources
            nodebin="$res/sidecar/node/bin/node"
          else
            res=packages/desktop/target/release
            nodebin="$res/sidecar/node/node.exe"
          fi
          got=$("$nodebin" "$res/sidecar/app/dist/bin.js" --version)
          echo "package CLI --version: $got (app $version)" | tee "$EVIDENCE/partial-check.txt"
          test "$got" = "$version"
          test -f "$res/THIRD-PARTY-SHELL-NOTICES.txt"
          echo "UNTESTED on $RUNNER_OS: the desktop package smoke (host, page, PDFium, keychain, Copilot, ingest, shell)" \
            | tee -a "$EVIDENCE/partial-check.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: macOS icon (ICNS 16/32 px entries parse; look at them in Finder and the Dock by hand)
        if: runner.os == 'macOS'
        run: |
          iconutil -c iconset packages/desktop/icons/icon.icns -o "$EVIDENCE/icon.iconset"
          ls -l "$EVIDENCE/icon.iconset" | tee "$EVIDENCE/icon-iconset.txt"
          test -f "$EVIDENCE/icon.iconset/icon_16x16.png"
          test -f "$EVIDENCE/icon.iconset/icon_32x32.png"

      - name: Collect the packages
        run: |
          mkdir -p release-out
          b=packages/desktop/target/release/bundle
          case "$RUNNER_OS" in
            Linux) cp "$b"/deb/*.deb "$b"/appimage/*.AppImage release-out/ ;;
            Windows) cp "$b"/nsis/*.exe release-out/ ;;
            macOS) cp "$b"/dmg/*.dmg release-out/ ;;
          esac
          ls -l release-out | tee "$EVIDENCE/packages.txt"

      - name: Upload the packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.target }}
          path: release-out/
          if-no-files-found: error
          retention-days: 14

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-${{ matrix.target }}
          path: release-evidence/
          if-no-files-found: warn
          retention-days: 14

  draft:
    name: Release draft
    needs: package
    runs-on: ubuntu-24.04
    # Only the release job may write, and only to make the draft.
    permissions:
      contents: write
    steps:
      - name: Download the packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: release-out
          merge-multiple: true

      - name: Make the draft (never published here)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          version=$(gh api "repos/$GH_REPO/contents/packages/app/package.json?ref=$SHA" --jq .content | base64 -d | jq -r .version)
          tag="v$version"
          (cd release-out && sha256sum -- * > SHA256SUMS.txt)
          cat release-out/SHA256SUMS.txt
          gh release create "$tag" --draft --target "$SHA" --title "ArgelanderSpace $version" \
            --notes "Draft made by the Release workflow from $SHA. Unsigned: see README (Installing the desktop app) for how to let macOS and Windows open it." \
            release-out/*
