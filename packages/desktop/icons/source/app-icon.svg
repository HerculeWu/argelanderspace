<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ArgelanderSpace app icon (desktop-app ticket 25): candidate F "Comparison" with four-pointed stars. One
       variable-star estimate in Argelander's step method, a 3 v 2 b: the brighter comparison star a, the star being
       measured v (accent colour, measuring ring) and the fainter comparison star b on a chart page with faint field
       stars; a bigger star is a brighter one, as on star charts. The line v-a has two ticks (three steps), v-b one
       tick (two steps). Original artwork, hand-written for this project; no icon set, font, star chart or other
       mark was used. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f9fb"/>
      <stop offset="1" stop-color="#dfe6ee"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#plate)"/>
