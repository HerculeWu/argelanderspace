# Desktop packages, put into a DRAFT GitHub Release (desktop-app ticket 26; docs/engineering.md 「发布工作流」). This is
# the repository's only workflow and it only releases: the four gates are not run here and there is no CI
# (docs/contracts.md; the user's change 9 of 2026-10-13). Nothing is published: the draft is looked at and made public
# by hand.
#
# What it builds: Linux x64 (deb and AppImage) by default. The macOS and Windows targets are kept but not run unless
# chosen by hand (the user's decision of 2026-10-15 in ticket 26: the shell builds only on Linux until it is ported,
# ticket 30); choosing them now fails in the shell's build.
#
# When it runs:
#   - a pushed tag `v<version>`, where <version> is packages/app/package.json's `version` (the single source,
#     ticket 16); any other tag fails in the preflight before anything is built. Builds linux-x64.
#   - by hand (Actions > Release > Run workflow) on a branch or tag: it builds that commit; with `draft` (off by
#     default) it also names a draft `v<version>`. `targets`: linux-x64 (the default), `all`, or one other target. A
#     draft is made only when `draft` is on and every chosen target succeeded. When a tag `v<version>` exists already
#     it must name the commit built (or nothing is made); otherwise the tag is made when the draft is published.
#
# Pins: actions by commit (the tag in the comment); the build's Node = the Node the package carries
# (DESKTOP_NODE_VERSION in packages/app/scripts/desktop-package-lib.mjs; the preflight checks they agree); pnpm from the
# root package.json's packageManager through corepack; Rust and tauri-cli below. The Node download's signature is
# always checked (fetch-node-keyring.mjs: nodejs/release-keys at a pinned commit, sha256-checked).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      targets:
        description: "Which targets to build (macOS and Windows: being ported, ticket 30; a draft only when all chosen succeed)"
        type: choice
        default: linux-x64
        options: [linux-x64, all, win32-x64, darwin-arm64, darwin-x64]
      draft:
        description: "Make the release draft when every chosen target succeeded (off: build and check only, nothing made)"
        type: boolean
        default: false

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  # One release run at a time, whatever the ref: a tag run and a manual run that makes a draft must not both pass the
  # duplicate check. A run by hand without a draft makes nothing and has a group of its own (it neither waits nor holds
  # the others up).
  group: ${{ (github.event_name == 'push' || inputs.draft == true) && 'release' || format('check-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.15.0"
  RUST_TOOLCHAIN: "1.96.0"
  TAURI_CLI_VERSION: "2.12.2"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Choose the targets
        id: matrix
        env:
          CHOSEN: ${{ github.event_name == 'workflow_dispatch' && inputs.targets || 'linux-x64' }}
        run: |
          all='[
            {"target":"linux-x64","os":"ubuntu-24.04","bundles":"deb,appimage"},
            {"target":"win32-x64","os":"windows-2022","bundles":"nsis"},
            {"target":"darwin-arm64","os":"macos-15","bundles":"dmg"},
            {"target":"darwin-x64","os":"macos-15-intel","bundles":"dmg"}
          ]'
          matrix=$(jq -c --arg t "$CHOSEN" '{include: [.[] | select($t == "all" or .target == $t)]}' <<<"$all")
          test "$(jq '.include | length' <<<"$matrix")" -gt 0
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 120
    outputs:
      # The app package's version the preflight read (the same commit on every target).
      version: ${{ steps.preflight.outputs.version }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      BUNDLES: ${{ matrix.bundles }}
      EVIDENCE: ${{ github.workspace }}/release-evidence/${{ matrix.target }}
    steps:
      # Windows cannot hold packages/core/src/pipelines/tex/facts/aux.ts (AUX is a reserved device name): git refuses
      # the checkout. Until the file is renamed (a decision outside desktop-app ticket 30), Windows checks out
      # everything else; the shell's own tests and build run, and the job then fails at the workspace build.
      - name: Windows only - let git list a path Windows cannot hold (it is left out of the checkout below)
        if: runner.os == 'Windows'
        run: git config --global core.protectNTFS false

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: >-
            ${{ runner.os == 'Windows'
            && format('/*{0}!/packages/core/src/pipelines/tex/facts/aux.ts', fromJSON('"\n"')) || '' }}
          sparse-checkout-cone-mode: ${{ runner.os != 'Windows' }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No cache: a release is built from a clean store.
          package-manager-cache: false

      - name: Preflight (tag rule, build Node, vendored license texts)
        id: preflight
        env:
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT: ${{ github.event_name }}
        run: |
          mkdir -p "$EVIDENCE"
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = tag ]; then
            node packages/app/scripts/release-preflight.mjs --target "$TARGET" --ref "$REF"
          else
            node packages/app/scripts/release-preflight.mjs --target "$TARGET"
          fi

      - name: Linux build and smoke dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # WebKitGTK/GTK for the shell; file/patchelf/libfuse2t64 for the AppImage bundler; gpgv for Node's signature;
          # xvfb for the shell smoke; latexmk with a minimal TeX Live for the smoke's CLI ingest.
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev file patchelf libfuse2t64 \
            gpgv unzip xvfb xauth latexmk texlive-latex-base

      - name: gpgv is there (fail closed otherwise)
        run: |
          if ! command -v gpgv >/dev/null; then
            if [ "$RUNNER_OS" = macOS ]; then brew install gnupg; fi
          fi
          command -v gpgv
          gpgv --version | head -n 1

      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"

      - name: The shell's unit tests and its test build on this platform (not a gate; desktop-app ticket 30)
        working-directory: packages/desktop
        run: |
          cargo test --locked 2>&1 | tee "$EVIDENCE/shell-unit-tests.txt"
          # The test build with the probe (debug only: smoke-probe does not compile in a release), used by the page
          # guard step below; built here so that its platform code is compiled even when a later step fails.
          cargo build --locked --features smoke-probe,packaged 2>&1 | tail -n 3

      - name: Shell page guard with a stand-in host (the shell alone, before the workspace build)
        run: |
          # desktop-app ticket 30: the test build runs a stand-in host (this runner's Node and a small script put in
          # target/debug/sidecar, removed afterwards) so the page guard, the single instance and quit are checked on
          # this platform's webview even when the workspace cannot be built here (Windows, aux.ts above).
          ext=""; if [ "$RUNNER_OS" = Windows ]; then ext=.exe; fi
          run=(node packages/app/scripts/smoke-shell-probe.mjs --stand-in-host \
            --shell "packages/desktop/target/debug/argelanderspace-desktop$ext" \
            --label "$TARGET-stand-in" --evidence "$EVIDENCE")
          if [ "$RUNNER_OS" = Linux ]; then run=(xvfb-run -a "${run[@]}"); fi
          "${run[@]}"

      - name: Install the workspace (frozen lockfile)
        run: corepack pnpm install --frozen-lockfile

      - name: Build (the npm build the package carries)
        run: corepack pnpm -r build

      - name: tauri-cli ${{ env.TAURI_CLI_VERSION }}
        run: cargo install tauri-cli --version "=$TAURI_CLI_VERSION" --locked --root "$RUNNER_TEMP/tauri-cli"

      - name: Node release keyring (pinned commit and sha256)
        run: node packages/app/scripts/fetch-node-keyring.mjs --out "$RUNNER_TEMP/node-release-keys.kbx"

      - name: Assemble the sidecar (dependency directory, Node with its signature checked, notices)
        id: sidecar
        # macOS: the shell's crate notices are not complete until the user decides how the objc2 crates' licenses are
        # carried (desktop-app ticket 30): shell-notices.mjs fails, closed, and no macOS package is made. The run goes
        # on only to test the shell (the page guard step below), and fails at its end ("No macOS package").
        continue-on-error: ${{ startsWith(matrix.target, 'darwin-') }}
        run: |
          node packages/app/scripts/desktop-sidecar.mjs --target "$TARGET" \
            --node-keyring "$RUNNER_TEMP/node-release-keys.kbx" --online 2>&1 | tee "$EVIDENCE/sidecar.txt"
          cp packages/desktop/target/package-resources/sidecar/sidecar-manifest.json "$EVIDENCE/"

      - name: Windows command-line launcher on a real cmd (code pages, special characters, bare-name start)
        if: runner.os == 'Windows'
        run: node packages/app/scripts/windows-launcher-check.mjs 2>&1 | tee "$EVIDENCE/windows-launcher.txt"

      - name: Build the shell and bundle (${{ matrix.bundles }})
        if: steps.sidecar.outcome == 'success'
        working-directory: packages/desktop
        run: |
          configs=(--config tauri.package.conf.json)
          # macOS and Windows show the product name ArgelanderSpace (the .app, the install folder); Linux keeps the
          # lower-case package name argelanderspace (the user's decision (d) of 2026-10-15, ticket 26).
          if [ "$RUNNER_OS" != Linux ]; then configs+=(--config tauri.package.macos-windows.conf.json); fi
          "$RUNNER_TEMP/tauri-cli/bin/cargo-tauri" build --features packaged "${configs[@]}" \
            --bundles "$BUNDLES" 2>&1 | tee "$EVIDENCE/tauri-build.txt"

      - name: Shell page guard on the platform's webview (a test build with the probe and the assembled resources)
        run: |
          # desktop-app ticket 30: the debug build with the smoke probe and `packaged` (built with the unit tests above),
          # with the assembled resources (sidecar/, skills/) put next to it in target/debug, where
          # a packaged build looks for them when run from cargo's output; so it runs the assembled Node and app build.
          # Not shipped: only release-out/ is uploaded.
          res=packages/desktop/target/package-resources
          dbg=packages/desktop/target/debug
          rm -rf "$dbg/sidecar" "$dbg/skills"
          cp -R "$res/sidecar" "$res/skills" "$dbg/"
          ext=""; if [ "$RUNNER_OS" = Windows ]; then ext=.exe; fi
          run=(node packages/app/scripts/smoke-shell-probe.mjs --shell "$dbg/argelanderspace-desktop$ext" \
            --label "$TARGET" --evidence "$EVIDENCE")
          if [ "$RUNNER_OS" = Linux ]; then run=(xvfb-run -a "${run[@]}"); fi
          "${run[@]}"
          rm -rf "$dbg/sidecar" "$dbg/skills"

      - name: Desktop package smoke (deb and AppImage, shell on a virtual display; the AppImage's through its AppRun)
        if: runner.os == 'Linux'
        run: |
          deb=$(ls packages/desktop/target/release/bundle/deb/*.deb)
          appimage=$(ls packages/desktop/target/release/bundle/appimage/*.AppImage)
          xvfb-run -a node packages/app/scripts/smoke-desktop-package.mjs --deb "$deb" --shell \
            --label deb --evidence "$EVIDENCE"
          xvfb-run -a node packages/app/scripts/smoke-desktop-package.mjs --appimage "$appimage" --shell \
            --label appimage --evidence "$EVIDENCE"

      - name: Partial check on macOS and Windows (the package smoke is Linux only)
        if: runner.os != 'Linux' && steps.sidecar.outcome == 'success'
        run: |
          # NOT the desktop package smoke (smoke-desktop-package.mjs reads a deb or an AppImage and /proc): only that
          # the sidecar's Node runs the sidecar's CLI at the app's version and the shell's notices are there. On macOS
          # this looks inside the built .app; on Windows only inside the build tree (target/release, where tauri-build
          # copies the resources) -- NOT inside the NSIS installer, whose contents are not unpacked or checked here.
          # Untested here: the host from the bundle, the page, PDFium, the keychain, Copilot, the ingest, the shell.
          version=$(node -p 'require("./packages/app/package.json").version')
          if [ "$RUNNER_OS" = macOS ]; then
            res=$(ls -d packages/desktop/target/release/bundle/macos/*.app)/Contents/Resources
            nodebin="$res/sidecar/node/bin/node"
            where="the built .app"
          else
            res=packages/desktop/target/release
            nodebin="$res/sidecar/node/node.exe"
            where="the build tree (not the installer)"
          fi
          got=$("$nodebin" "$res/sidecar/app/dist/bin.js" --version)
          echo "package CLI --version in $where: $got (app $version)" | tee "$EVIDENCE/partial-check.txt"
          test "$got" = "$version"
          test -f "$res/THIRD-PARTY-SHELL-NOTICES.txt"
          {
            echo "UNTESTED on $RUNNER_OS: the desktop package smoke (host, page, PDFium, keychain, Copilot, ingest, shell)"
            if [ "$RUNNER_OS" = Windows ]; then echo "UNTESTED on Windows: the NSIS installer's contents"; fi
          } | tee -a "$EVIDENCE/partial-check.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: macOS icon (the built .app's ICNS 16/32 px entries parse; look at them in Finder and the Dock by hand)
        if: runner.os == 'macOS' && steps.sidecar.outcome == 'success'
        run: |
          # The ICNS the bundle carries, not the repository's source file.
          shopt -s nullglob
          icns=(packages/desktop/target/release/bundle/macos/*.app/Contents/Resources/*.icns)
          test "${#icns[@]}" -eq 1
          iconutil -c iconset "${icns[0]}" -o "$EVIDENCE/icon.iconset"
          ls -l "$EVIDENCE/icon.iconset" | tee "$EVIDENCE/icon-iconset.txt"
          test -f "$EVIDENCE/icon.iconset/icon_16x16.png"
          test -f "$EVIDENCE/icon.iconset/icon_32x32.png"

      - name: No macOS package (the shell's crate notices wait for the user's decision, ticket 30)
        if: steps.sidecar.outcome != 'success'
        run: |
          echo "::error::no package for $TARGET: the sidecar (the shell's crate notices) did not complete" \
            | tee -a "$EVIDENCE/no-package.txt"
          exit 1

      - name: Collect the packages
        run: |
          mkdir -p release-out
          b=packages/desktop/target/release/bundle
          case "$RUNNER_OS" in
            Linux) cp "$b"/deb/*.deb "$b"/appimage/*.AppImage release-out/ ;;
            Windows) cp "$b"/nsis/*.exe release-out/ ;;
            macOS) cp "$b"/dmg/*.dmg release-out/ ;;
          esac
          ls -l release-out | tee "$EVIDENCE/packages.txt"

      - name: Upload the packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.target }}
          path: release-out/
          if-no-files-found: error
          retention-days: 14

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-${{ matrix.target }}
          path: release-evidence/
          if-no-files-found: warn
          retention-days: 14

  draft:
    name: Release draft
    needs: package
    # A tag run always makes the draft; a run by hand only when asked (`draft`, off by default: desktop-app ticket 30
    # builds and checks branches without making any draft).
    if: github.event_name == 'push' || inputs.draft == true
    runs-on: ubuntu-24.04
    # Only this job may write, and only to make the draft.
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Download the packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: release-out
          merge-multiple: true

      - name: Make the draft (never published here)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          # The version the preflight read from packages/app/package.json at this commit; a semantic version or nothing.
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! [[ "$VERSION" =~ $semver ]]; then
            echo "::error::the preflight's version '$VERSION' is not a semantic version: nothing made"
            exit 1
          fi
          tag="v$VERSION"

          # A tag of that name must name this very commit: a draft is tied to its tag, so the packages and the tag
          # would otherwise come from different commits. An annotated tag is unwrapped down to its commit.
          found=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" \
            --jq ".[] | select(.ref == \"refs/tags/$tag\") | .object.type + \" \" + .object.sha")
          verify=()
          if [ -n "$found" ]; then
            read -r type sha <<<"$found"
            for _ in 1 2 3 4 5; do
              [ "$type" = tag ] || break
              read -r type sha <<<"$(gh api "repos/$GH_REPO/git/tags/$sha" --jq '.object.type + " " + .object.sha')"
            done
            if [ "$type" != commit ] || [ "$sha" != "$SHA" ]; then
              echo "::error::the tag $tag names $type $sha, not this run's commit $SHA: nothing made"
              exit 1
            fi
            verify=(--verify-tag)
          elif [ "$EVENT" = push ]; then
            echo "::error::a tag run, but the tag $tag is not in the repository: nothing made"
            exit 1
          fi

          # No release of that tag yet, drafts included (this token may see drafts): never a second one.
          existing=$(gh api --paginate "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$tag\") | .id")
          if [ -n "$existing" ]; then
            echo "::error::a release or draft for $tag exists already (id $existing): nothing made"
            exit 1
          fi

          (cd release-out && sha256sum -- * > SHA256SUMS.txt)
          cat release-out/SHA256SUMS.txt
          gh release create "$tag" --draft "${verify[@]}" --target "$SHA" --title "ArgelanderSpace $VERSION" \
            --notes "Draft made by the Release workflow from $SHA. The packages are not signed: see README (Installing the desktop app)." \
            release-out/*
